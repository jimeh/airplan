openapi: 3.0.3
info:
  title: Airplan API
  version: 1.0.0
  description: |
    Single-user API for marker-managed Airplan uploads. Capability URLs and
    object keys are sent in request bodies so they do not appear in access
    logs. The server is intentionally single-instance in version 1.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
  - name: uploads
  - name: manifest
  - name: storage
paths:
  /healthz:
    get:
      operationId: health
      tags: [system]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      tags: [system]
      security: []
      responses:
        "200":
          description: The exact OpenAPI source embedded in this binary.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [system]
      responses:
        "200":
          description: Safe server compatibility information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/documents:
    post:
      operationId: uploadDocument
      tags: [uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, document]
              properties:
                metadata:
                  $ref: "#/components/schemas/DocumentMetadata"
                document:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        "201":
          description: The document was rendered and uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/documents/update:
    post:
      operationId: updateDocument
      tags: [uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, document]
              properties:
                metadata:
                  $ref: "#/components/schemas/UpdateDocumentMetadata"
                document:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        "201":
          description: A linked document revision was uploaded or repaired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDocumentResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/collections:
    post:
      operationId: uploadCollection
      tags: [uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, files]
              properties:
                metadata:
                  $ref: "#/components/schemas/CollectionMetadata"
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        "201":
          description: The collection was rendered and uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/inspect:
    post:
      operationId: inspectUpload
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetRequest"
      responses:
        "200":
          description: Validated marker-managed upload state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadInspection"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/get:
    post:
      operationId: getUpload
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetUploadRequest"
      responses:
        "200":
          description: A marker-declared page, source, member, or marker.
          headers:
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            X-Airplan-Object-Key:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/delete:
    post:
      operationId: deleteUpload
      tags: [uploads]
      description: |
        Permanently deletes one marker-managed upload. Payloads are deleted
        before the ownership marker and the manifest receives a tombstone.
        A purge-protected upload is refused unless force is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: The upload was deleted or reconciled as already absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/protect:
    post:
      operationId: protectUpload
      tags: [uploads]
      description: |
        Marks one marker-managed upload as purge-protected by writing its
        protection sentinel object. Protecting an already protected upload
        succeeds and rewrites the sentinel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectRequest"
      responses:
        "200":
          description: The upload is purge-protected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/unprotect:
    post:
      operationId: unprotectUpload
      tags: [uploads]
      description: |
        Removes purge protection from one marker-managed upload by deleting
        its protection sentinel object. Unprotecting an unprotected upload
        succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetRequest"
      responses:
        "200":
          description: The upload is no longer purge-protected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/upgrades/plan:
    post:
      operationId: planDocumentUpgrade
      tags: [uploads]
      description: Classifies one source-backed Markdown upload without writing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradePlanRequest"
      responses:
        "200":
          description: A plan bound to the inspected marker and page ETags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeDocumentPlan"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/upgrades/execute:
    post:
      operationId: executeDocumentUpgrade
      tags: [uploads]
      description: Replans live state, then applies a still-upgradeable exact plan after revalidating its ETags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeDocumentPlan"
      responses:
        "200":
          description: The upgraded document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeDocumentResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/upgrades/preview:
    post:
      operationId: planBulkUpgrade
      tags: [manifest, uploads]
      description: Classifies active server-manifest records without writing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpgradeOptions"
      responses:
        "200":
          description: Ordered candidate classifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpgradePlan"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/upgrades:
    post:
      operationId: executeBulkUpgrade
      tags: [manifest, uploads]
      description: Applies only the exact upgradeable plans supplied by preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpgradeRequest"
      responses:
        "200":
          description: Ordered per-item outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpgradeResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads:
    get:
      operationId: listManifestUploads
      tags: [manifest]
      description: |
        Reads the server manifest without contacting storage. Results are
        scoped to the server profile, bucket, and key prefix.
      responses:
        "200":
          description: Active and historical scoped manifest records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/storage/uploads:
    get:
      operationId: listStorageUploads
      tags: [storage]
      description: Lists marker candidates from one direct storage snapshot.
      responses:
        "200":
          description: LIST-derived upload candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sync:
    post:
      operationId: syncManifest
      tags: [manifest, storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Planned or applied reconciliation, including failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/purge/preview:
    post:
      operationId: previewPurge
      tags: [manifest, storage]
      description: Plans candidates without deleting anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgePreviewRequest"
      responses:
        "200":
          description: Explicit upload IDs eligible for reviewed deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgePreview"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/purge:
    post:
      operationId: executePurge
      tags: [manifest, storage]
      description: |
        Permanently deletes the explicit upload IDs after revalidating every
        ownership marker. Later targets are attempted after an item failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeRequest"
      responses:
        "200":
          description: Every per-upload success or failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static single-user server token.
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        request_id:
          type: string
        protect_reason:
          type: string
          maxLength: 256
          description: >-
            Advisory purge-protection reason accompanying the
            upload_protected code, when the sentinel body could be read.
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - api_version
        - server_version
        - operations
        - upload_formats
        - limits
        - marker_versions
      properties:
        api_version:
          type: string
          enum: [v1]
        server_version:
          type: string
        operations:
          type: array
          items:
            type: string
        upload_formats:
          type: array
          items:
            type: string
            enum: [md, html, txt]
        limits:
          $ref: "#/components/schemas/UploadLimits"
        marker_versions:
          type: array
          items:
            type: integer
            minimum: 1
    UpgradeState:
      type: string
      enum: [upgradeable, current, ineligible, invalid, missing]
    UpgradePlanRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: string
          minLength: 1
        force:
          type: boolean
    UpgradeDocumentPlan:
      type: object
      additionalProperties: false
      required:
        - target
        - state
        - target_marker_version
        - target_producer_version
        - target_renderer_generation
      properties:
        target: {type: string}
        bucket: {type: string}
        state: {$ref: "#/components/schemas/UpgradeState"}
        reason: {type: string}
        url: {type: string}
        marker_key: {type: string}
        page_key: {type: string}
        source_key: {type: string}
        current_marker_version: {type: integer}
        current_producer_version: {type: string}
        current_renderer_generation: {type: integer}
        target_marker_version: {type: integer, minimum: 1}
        target_producer_version: {type: string}
        target_renderer_generation: {type: integer, minimum: 1}
        marker_etag: {type: string}
        page_etag: {type: string}
        source_etag: {type: string}
        force: {type: boolean}
    UpgradeDocumentResult:
      type: object
      additionalProperties: false
      required: [result, state, upgraded]
      properties:
        result: {$ref: "#/components/schemas/UploadResult"}
        state: {$ref: "#/components/schemas/UpgradeState"}
        upgraded: {type: boolean}
        reason: {type: string}
    BulkUpgradeOptions:
      type: object
      additionalProperties: false
      properties:
        concurrency: {type: integer, minimum: 1, maximum: 32}
    BulkUpgradePlan:
      type: object
      additionalProperties: false
      required: [items, counts]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/UpgradeDocumentPlan"}
        warnings:
          type: array
          items: {type: string}
        counts:
          type: object
          additionalProperties: {type: integer, minimum: 0}
    BulkUpgradeRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/UpgradeDocumentPlan"}
        concurrency: {type: integer, minimum: 1, maximum: 32}
    BulkUpgradeItemResult:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: {$ref: "#/components/schemas/UpgradeDocumentPlan"}
        result:
          $ref: "#/components/schemas/UpgradeDocumentResult"
          x-go-type-skip-optional-pointer: false
        error: {type: string}
    BulkUpgradeResult:
      type: object
      additionalProperties: false
      required: [items, upgraded, failed]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/BulkUpgradeItemResult"}
        upgraded: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
    UploadLimits:
      type: object
      additionalProperties: false
      required: [document_bytes, collection_file_bytes, collection_total_bytes]
      properties:
        document_bytes:
          type: integer
          format: int64
          minimum: 1
        collection_file_bytes:
          type: integer
          format: int64
          minimum: 1
        collection_total_bytes:
          type: integer
          format: int64
          minimum: 1
    DocumentMetadata:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        format:
          type: string
          enum: [md, html, txt]
        title:
          type: string
        slug:
          type: string
        lang:
          type: string
        repository_url:
          type: string
          format: uri
        max_size:
          type: integer
          format: int64
          minimum: 1
    CollectionMetadata:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        repository_url:
          type: string
          format: uri
        max_size:
          type: integer
          format: int64
          minimum: 1
        max_total_size:
          type: integer
          format: int64
          minimum: 1
    TargetRequest:
      type: object
      additionalProperties: false
      required: [url_or_key]
      properties:
        url_or_key:
          type: string
          minLength: 1
    GetUploadRequest:
      type: object
      additionalProperties: false
      required: [url_or_key]
      properties:
        url_or_key:
          type: string
          minLength: 1
        source:
          type: boolean
          default: false
        diff:
          type: boolean
          default: false
    DeleteRequest:
      type: object
      additionalProperties: false
      required: [url_or_key]
      properties:
        url_or_key:
          type: string
          minLength: 1
        force:
          type: boolean
          default: false
    ProtectRequest:
      type: object
      additionalProperties: false
      required: [url_or_key]
      properties:
        url_or_key:
          type: string
          minLength: 1
        reason:
          type: string
          maxLength: 256
    ProtectionResult:
      type: object
      additionalProperties: false
      required: [id, marker_key, sentinel_key, page_key, kind, protected, warnings]
      properties:
        id:
          type: string
        marker_key:
          type: string
        sentinel_key:
          type: string
        page_key:
          type: string
        kind:
          type: string
          enum: [document, collection]
        protected:
          type: boolean
        protected_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
        reason:
          type: string
        warnings:
          type: array
          items:
            type: string
    UploadResult:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - url
        - key
        - bucket
        - bytes
        - content_type
        - created_at
        - marker_version
        - marker_key
        - warnings
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [document, collection]
        url:
          type: string
          format: uri
        key:
          type: string
        source_url:
          type: string
          format: uri
        source_key:
          type: string
        bucket:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 0
        content_type:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
        marker_version:
          type: integer
          minimum: 1
        marker_key:
          type: string
        format:
          type: string
        slug:
          type: string
        repository_url:
          type: string
          format: uri
        revision_chain_id:
          type: string
        revision:
          type: integer
          minimum: 1
        latest_revision:
          type: integer
          minimum: 1
        warnings:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileResult"
    UpdateDocumentMetadata:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: string
          minLength: 1
        name:
          type: string
        title:
          type: string
        max_size:
          type: integer
          format: int64
          minimum: 1
    UpdateDocumentResult:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - url
        - key
        - bucket
        - bytes
        - content_type
        - created_at
        - marker_version
        - marker_key
        - warnings
        - unchanged
      properties:
        id: {type: string}
        kind:
          type: string
          enum: [document, collection]
        url: {type: string, format: uri}
        key: {type: string}
        source_url: {type: string, format: uri}
        source_key: {type: string}
        bucket: {type: string}
        bytes: {type: integer, format: int64, minimum: 0}
        content_type: {type: string}
        title: {type: string}
        created_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
        marker_version: {type: integer, minimum: 1}
        marker_key: {type: string}
        format: {type: string}
        slug: {type: string}
        repository_url: {type: string, format: uri}
        revision_chain_id: {type: string}
        revision: {type: integer, minimum: 1}
        latest_revision: {type: integer, minimum: 1}
        warnings:
          type: array
          items: {type: string}
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileResult"
        previous_url: {type: string, format: uri}
        diff_url: {type: string, format: uri}
        unchanged: {type: boolean}
    FileResult:
      type: object
      additionalProperties: false
      required: [name, url, key, bytes, content_type]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        key:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 0
        content_type:
          type: string
    VersionsRevision:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number: {type: integer, minimum: 1}
        url: {type: string, format: uri}
        created_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
        diff_url: {type: string, format: uri}
        deleted: {type: boolean}
        deleted_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
    VersionsMetadata:
      type: object
      additionalProperties: false
      required: [schema, version, chain_id, current_revision, latest_revision, last_assigned_revision, revisions]
      properties:
        schema: {type: string, enum: [airplan-versions]}
        version: {type: integer, enum: [1]}
        chain_id: {type: string}
        current_revision: {type: integer, minimum: 1}
        latest_revision: {type: integer, minimum: 1}
        last_assigned_revision: {type: integer, minimum: 1}
        revisions:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/VersionsRevision"}
    InspectedObject:
      type: object
      additionalProperties: false
      required: [key, exists, bytes, expected_bytes, expected_known]
      properties:
        key:
          type: string
        url:
          type: string
          format: uri
        exists:
          type: boolean
        bytes:
          type: integer
          format: int64
          minimum: 0
        expected_bytes:
          type: integer
          format: int64
          minimum: 0
        expected_known:
          type: boolean
    UploadInspection:
      type: object
      additionalProperties: false
      required:
        - state
        - id
        - marker_key
        - objects
        - bytes
        - files
        - warnings
      properties:
        state:
          type: string
          enum: [complete, incomplete, invalid]
        id:
          type: string
        marker_key:
          type: string
        objects:
          type: integer
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
        format:
          type: string
        kind:
          type: string
          enum: [document, collection]
        title:
          type: string
        repository_url:
          type: string
          format: uri
        marker_version:
          type: integer
          minimum: 0
        producer_version:
          type: string
        renderer_version:
          type: integer
          minimum: 1
        revision_chain_id:
          type: string
        revision:
          type: integer
          minimum: 1
        latest_revision:
          type: integer
          minimum: 1
        latest_url:
