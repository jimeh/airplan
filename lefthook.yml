pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: golangci-lint fmt --diff {staged_files}
    go-lint:
      glob: "*.go"
      # golangci-lint is package-scoped; the repo is small enough to
      # lint whole whenever any Go file is staged.
      run: golangci-lint run
    markdown:
      glob: "*.md"
      exclude: "airplan/testdata/*"
      run: bun run oxfmt -- --check --no-error-on-unmatched-pattern {staged_files}
    web-format:
      glob: "*.{ts,mts,css,json,toml}"
      exclude: "{airplan/assets/generated/**,airplan/testdata/**,bun.lock,schema/airplan.schema.json}"
      run: bun run oxfmt -- --check --no-error-on-unmatched-pattern {staged_files}
    web-lint:
      glob: "*.{ts,mts}"
      run: bun run oxlint -- {staged_files}
    css-lint:
      glob: "web/styles/*.css"
      run: bun run stylelint -- {staged_files}
    web-typecheck:
      glob: "{web/**,tests/browser/**,playwright.config.ts,package.json,bun.lock,tsconfig*.json,.oxlintrc.json}"
      run: mise run typecheck:web && mise run lint:ts
    workflows:
      glob: ".github/workflows/*.yml"
      run: mise run lint:workflows
