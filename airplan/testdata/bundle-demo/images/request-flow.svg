<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">API request flow</title>
  <desc id="desc">Clients send bearer tokens to the identity gateway, which forwards verified account IDs to the account service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="220" rx="18" fill="#f8fafc"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle">
    <rect x="50" y="65" width="190" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="145" y="105" fill="#1e3a8a">Clients</text>
    <text x="145" y="132" fill="#475569" font-size="14">Bearer token</text>
    <rect x="355" y="65" width="190" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="450" y="105" fill="#4c1d95">Identity gateway</text>
    <text x="450" y="132" fill="#475569" font-size="14">Verify + strip headers</text>
    <rect x="660" y="65" width="190" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="755" y="105" fill="#14532d">Account service</text>
    <text x="755" y="132" fill="#475569" font-size="14">Verified account ID</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 240 110 H 345"/>
    <path d="M 545 110 H 650"/>
  </g>
</svg>
