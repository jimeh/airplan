[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[settings.task]
run_auto_install = true

[tools]
bun = "1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1"
goreleaser = "2"
golangci-lint = "2"
lefthook = "2"
actionlint = "1"
zizmor = "1"
pinact = "4"
syft = "1"
"github:jimeh/treeboot" = "0"

[tasks.build]
description = "Build the airplan binary (skipped when nothing changed)"
run = "go build -o bin/airplan ."
sources = ["main.go", "go.mod", "go.sum", "cli/**/*.go", "airplan/**/*", "skills/**/*"]
outputs = ["bin/airplan"]

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks."test:coverage"]
description = "Run all tests and write statement coverage reports"
run = [
  "go test -covermode=atomic -coverprofile=coverage.out ./...",
  "go tool cover -func=coverage.out",
  "go tool cover -html=coverage.out -o coverage.html",
]

[tasks.test-integration]
description = "Round-trip tests against a throwaway MinIO container"
run = "go test -tags integration -count=1 -v -run TestIntegration ./airplan/"

[tasks."test:browser"]
description = "Run rendered-page browser smoke tests in Chromium"
run = ["bun ci", "bunx playwright install chromium", "bun run test:browser"]

[tasks."test:web"]
description = "Run pure TypeScript unit tests"
run = "bun run test:web"

[tasks."test:container-integration"]
description = "Run the MinIO-backed Airplan server image smoke test"
depends = ["container:build"]
run = "scripts/container/integration.sh"

[tasks."audit:deps"]
description = "Verify and scan Go and Bun dependencies"
run = ["go mod verify", "govulncheck ./...", "bun audit --audit-level=high"]

[tasks.generate]
description = "Regenerate committed generated files"
run = ["go generate ./...", "bun run build:web"]

[tasks."generate:web"]
description = "Regenerate committed browser assets"
run = "bun run build:web"

[tasks."generate:web:check"]
description = "Check committed browser assets are up to date"
run = "bun run build:web:check"

[tasks."generate:check"]
description = "Check generated files are up to date"
depends = ["generate:go:check", "generate:web:check"]

[tasks."generate:go:check"]
description = "Check Go-owned generated files are up to date"
run = [
  "go run ./internal/cmd/checkopenapi",
  "go run ./internal/cmd/genschema --check schema/airplan.schema.json",
  "go run ./internal/cmd/genmermaid --check internal/deps/mermaid.json airplan/mermaid_generated.go",
]

[tasks."check:spec-sync"]
description = "Check contract changes include specification version updates"
run = "go run ./internal/cmd/checkspecsync"

[tasks."check:go-version"]
description = "Check .go-version matches the go.mod Go directive"
run = "go run ./internal/cmd/checkgoversion"

[tasks."update:mermaid"]
description = "Update the pinned Mermaid release after its minimum age"
run = "go run ./internal/cmd/updatemermaid"

[tasks.lint]
description = "All lints"
depends = ["lint:go", "lint:web", "lint:workflows"]

[tasks."lint:web"]
description = "Lint TypeScript and CSS"
depends = ["lint:ts", "lint:css"]

[tasks."lint:ts"]
description = "Lint TypeScript with ordinary and type-aware rules"
run = "bun run lint:ts"

[tasks."lint:css"]
description = "Lint authored CSS"
run = "bun run lint:css"

[tasks."typecheck:web"]
description = "Typecheck browser and Playwright TypeScript projects"
run = "bun run typecheck:web"

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run"

[tasks."lint:workflows"]
description = "Validate GitHub Actions: syntax, security, SHA pins"
run = [
  "scripts/container/release_test.sh",
  "actionlint -ignore 'unexpected key \"queue\" for \"concurrency\" section'",
  "zizmor --offline .github/workflows",
  "pinact run --check",
]

[tasks.format]
description = "Format everything (write mode)"
depends = ["format:go", "format:web"]

[tasks."format:check"]
description = "Check formatting without writing changes"
depends = ["format:go:check", "format:web:check"]

[tasks."format:go"]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks."format:go:check"]
description = "Check Go formatting without writing changes"
run = "golangci-lint fmt --diff"

[tasks."format:markdown"]
description = "Format Markdown files"
run = "bun run oxfmt -- \"**/*.md\""

[tasks."format:markdown:check"]
description = "Check Markdown formatting without writing changes"
run = "bun run oxfmt -- --check \"**/*.md\""

[tasks."format:web"]
description = "Format web sources and repository text"
run = "bun run format"

[tasks."format:web:check"]
description = "Check web sources and repository text formatting"
run = "bun run format:check"

[tasks.check]
description = "Fast confidence gate: lints, generation, format checks, tests"
depends = [
  "check:go",
  "generate:web:check",
  "lint:web",
  "typecheck:web",
  "test:web",
  "lint:workflows",
  "format:web:check",
]

[tasks."check:go"]
description = "Go confidence gate: lint, generation, format, version, tests"
depends = ["lint:go", "generate:go:check", "format:go:check", "check:go-version", "test"]

[tasks."release:snapshot"]
description = "Build a release snapshot without publishing"
run = ["goreleaser check", "goreleaser release --snapshot --clean --skip=publish"]

[tasks."container:context"]
description = "Build snapshot binaries and prepare the container context"
run = ["goreleaser build --snapshot --clean", "go run ./internal/cmd/preparecontainer"]

[tasks."container:build"]
description = "Build and load the native Airplan server image"
depends = ["container:context"]
run = "scripts/container/build.sh"

[tasks."container:check"]
description = "Build both image platforms and check the native image"
depends = ["container:context"]
run = "scripts/container/check.sh"

[tasks.verify]
description = "Broad local validation before handoff"
run = [
  "mise run check",
  "mise run audit:deps",
  "mise run test-integration",
  "mise run release:snapshot",
  "mise run container:check",
  "mise run test:container-integration",
]

[tasks.setup]
description = "Install tools and git hooks"
run = ["mise install", "bun ci", "lefthook install"]

[tasks.treeboot]
description = "Bootstrap the current worktree with treeboot"
run = "treeboot"
