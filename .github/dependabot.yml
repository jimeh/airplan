version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      # semantic-pr enforces conventional titles; release-please
      # reads them.
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # The weekly Mermaid updater keeps the runtime manifest, browser-test
      # package, generated Go, and render goldens in sync.
      - dependency-name: mermaid
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
