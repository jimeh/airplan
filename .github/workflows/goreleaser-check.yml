name: GoReleaser check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Runs outside pull requests each get their own group, so only a superseded
# pull request run is cancelled. A `labeled` event for any other label skips
# the job, so it also gets its own group and cannot cancel a real run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event.action == 'labeled' &&
        github.event.label.name != 'ci:goreleaser') && github.run_id ||
      github.event.pull_request.number || github.run_id
    }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_DISABLE_TOOLS: go

jobs:
  goreleaser-check:
    if: >-
      github.event_name == 'push' ||
      (
        contains(github.event.pull_request.labels.*.name, 'ci:goreleaser') &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'ci:goreleaser'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          add_shims_to_path: false
          minimum_release_age: 3d
          persist_github_token: true
          cache_save: ${{ github.event_name != 'pull_request' }}
          install_args: goreleaser
      - run: mise run release:snapshot
