name: GoReleaser check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  MISE_DISABLE_TOOLS: go

jobs:
  goreleaser-check:
    if: >-
      github.event_name == 'push' ||
      (
        contains(github.event.pull_request.labels.*.name, 'ci:goreleaser') &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'ci:goreleaser'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          add_shims_to_path: false
          cache_save: ${{ github.event_name != 'pull_request' }}
          install_args: goreleaser
      - run: mise run release:snapshot
